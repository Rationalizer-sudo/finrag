# =============================================================================
#  FinRAG · Nginx 站点配置
#  用途：托管 Vue3 构建产物（history 路由）+ 反向代理 /api 到 FastAPI 后端
#  部署位置：容器内 /etc/nginx/conf.d/default.conf
#            （由 docker/frontend.Dockerfile 从 nginx/default.conf 拷贝）
#  本文件内容被 include 在 http {} 上下文，因此可直接使用 server / gzip 指令。
# =============================================================================

# -----------------------------------------------------------------------------
# 后端上游
#   * docker-compose.yml 中后端服务名为 backend，容器内 DNS 解析为 backend:8000。
#   * 使用变量 + resolver 而非固定 upstream：backend 容器重建后 IP 会变化，
#     固定 upstream 会让 Nginx 一直转发到旧 IP（502）直到重载配置。
#     127.0.0.11 是 Docker 内置 DNS，配合变量可实现请求时动态解析。
# -----------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # 静态资源根目录 = Vue3 构建产物 dist
    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # 上传接口需要传制度文件（PDF/图片），需大于后端 MAX_UPLOAD_MB（默认 50）
    client_max_body_size 60m;
    client_body_timeout  300s;

    # 隐藏 Nginx 版本号，减少信息泄露
    server_tokens off;

    # =========================================================================
    # 1. gzip 压缩
    #    注意：gzip 只对文本类资源生效，图片/字体已压缩，重复压缩无收益。
    # =========================================================================
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.api+json
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # =========================================================================
    # 2. 流式问答（SSE）——必须放在 /api/ 之前
    #    Nginx 匹配的是「最长前缀」，但同长度时以先定义者为准，
    #    这里显式前置以保证 /api/v1/qa/ask/stream 命中本段。
    #
    #    为什么要这样配？
    #      * proxy_buffering off：Nginx 默认会缓冲上游响应，攒够 buffer 才下发，
    #        导致 SSE 的 event: delta 被整段攒住，前端「打字机」效果消失，
    #        极端情况要等回答全部生成完才收到内容（用户体验等同非流式）。
    #      * proxy_cache off：中间层缓存会破坏事件流。
    #      * proxy_read_timeout 300s：LLM 生成 + 多轮检索可能超过默认 60s，
    #        超时会 504 并把已生成内容截断。
    #      * X-Accel-Buffering no：告诉 Nginx 对本响应关闭缓冲
    #        （后端 app/api/v1/qa.py 也主动返回了同名响应头，双保险）。
    #      * Connection "" + HTTP/1.1：保持长连接，避免频繁重建。
    #      * chunked_transfer_encoding on：分块传输，边生成边下发。
    # =========================================================================
    location = /api/v1/qa/ask/stream {
        set $finrag_backend "http://backend:8000";

        proxy_pass $finrag_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;

        # ---- SSE 关键三件套 ----
        proxy_buffering      off;
        proxy_cache          off;
        proxy_request_buffering off;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        proxy_connect_timeout 30s;
        chunked_transfer_encoding on;

        # 明确告知 Nginx 不要缓冲本响应体
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # =========================================================================
    # 3. 后端 API 反向代理
    #    /api/v1/qa/ask  -> http://backend:8000/api/v1/qa/ask
    #    使用 $request_uri 可原样保留路径与查询串（?user_id=xxx&limit=20 不丢）。
    # =========================================================================
    location /api/ {
        set $finrag_backend "http://backend:8000";

        proxy_pass $finrag_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;

        # 普通 JSON 接口开启缓冲（提升吞吐）；大文件上传响应也不至于卡住
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         8 32k;
        proxy_busy_buffers_size 64k;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        # 提问接口需调用大模型，超时给足（≤2s 为设计目标，但冷启动会慢）
        proxy_read_timeout    120s;

        # 保留后端的统一错误体（不要用 error_page 覆盖成 Nginx 默认页）
        proxy_intercept_errors off;
    }

    # =========================================================================
    # 4. 后端自带的接口文档与静态 UI（可选放行，便于部署后自检）
    #    FastAPI 默认在 /docs、/redoc、/openapi.json 提供 Swagger/Redoc；
    #    backend/app/static 的备用 UI 挂载在 /ui。
    #    生产环境若不希望对外暴露接口文档，删除本段即可。
    # =========================================================================
    location ~ ^/(docs|redoc|openapi\.json|ui)(/|$) {
        set $finrag_backend "http://backend:8000";

        proxy_pass $finrag_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # =========================================================================
    # 5. 带内容哈希的构建产物：可长期强缓存（Vite 输出文件名含 hash）
    # =========================================================================
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|eot|map)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # =========================================================================
    # 6. index.html 绝不缓存
    #    否则前端发版后用户仍加载旧的 index.html，引用了已被清理的 hash 资源 -> 白屏
    # =========================================================================
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # =========================================================================
    # 7. SPA history 路由回退
    #    Vue Router 的 /qa、/knowledge/123 等路径在服务器上并无实体文件，
    #    直接刷新会 404，因此统一回退到 index.html 交给前端路由处理。
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # =========================================================================
    # 7.1 兼容后端自带的 /app 静态挂载路径
    #    backend/app/main.py 会把 frontend/dist 挂到 /app 并让根路径 302 到 /app/。
    #    本 Nginx 在根路径托管前端，这里把 /app/ 重定向回根，避免用户从前端
    #    源码或旧书签访问时拿到后端的另一份构建产物（两份资源版本可能不一致）。
    #    若你反而希望由后端托管前端（采用 .env.production 默认的 /app/ 基址），
    #    删除本段，并把 docker-compose.yml 中 backend 的 /app 代理交给后端即可。
    # =========================================================================
    location = /app {
        return 301 /;
    }

    location /app/ {
        return 301 /;
    }

    # =========================================================================
    # 8. 健康检查入口（供容器 HEALTHCHECK / 负载均衡探活使用）
    # =========================================================================
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # =========================================================================
    # 9. 隐藏文件与日志目录防护（防御性配置）
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # 10. 网关错误兜底
    #     502/503/504 通常意味着 backend 容器未就绪或已崩溃，
    #     这里返回一段纯文本提示，避免把 Nginx 默认错误页暴露给用户。
    #     排查：docker compose logs -f backend
    # =========================================================================
    error_page 502 503 504 = @backend_unavailable;
    location @backend_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":50300,"message":"后端服务暂不可用，请稍后重试或联系管理员（backend 容器未就绪）","detail":null}';
    }
}
