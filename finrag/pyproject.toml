[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
#  FinRAG · 基于 RAG 的金融制度类知识问答系统
#  统一工程配置：代码规范（PEP8）、测试、覆盖率、打包
# ============================================================================

[project]
name = "finrag"
version = "1.0.0"
description = "基于 RAG 的金融制度类知识问答系统（MySQL + Milvus + LangChain + 通义千问）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FinRAG 校企合作项目组" }]
keywords = ["RAG", "LangChain", "Milvus", "金融制度", "知识问答", "FastAPI"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 运行依赖统一由 requirements.txt 维护，避免两处漂移
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "flake8>=7.0",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.10",
]

[project.urls]
Documentation = "./README.md"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-dir]
"" = "backend"

# ---------------------------------------------------------------------------
#  pytest / 覆盖率
#  课题实施约束：遵循 PEP8，核心模块单元测试覆盖率 ≥ 70%
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "backend"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # 覆盖率门槛：低于 70% 直接判定失败
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:var/coverage-html",
    "--cov-report=xml:var/coverage.xml",
    "--cov-fail-under=70",
]
markers = [
    "slow: 较慢的用例（集成/端到端）",
    "integration: 集成测试",
]
filterwarnings = [
    "ignore::DeprecationWarning:jieba.*",
    "ignore::ResourceWarning",
    "ignore::UserWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# 课题要求：核心模块覆盖率 ≥ 70%
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "def __repr__",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "var/coverage-html"

# ---------------------------------------------------------------------------
#  PEP8 代码规范：ruff（lint）+ black/isort（format）
#  行宽 100：中文注释与 f-string 在 88 列下过于局促
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend", "scripts", "tests"]
exclude = [
    ".git", ".venv", "venv", "var", "data/demo",
    "frontend/node_modules", "frontend/dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors（PEP8）
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]
ignore = [
    "E501",   # 行宽由 formatter 负责
    "B008",   # FastAPI 的 Depends()/File() 默认参数是官方用法
    "SIM108", # 三元表达式不总是更清晰
    "RET504", # 允许 return 前赋值以提升可读性
    "B904",   # 脚本场景允许不带 from 的 raise
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "E402"]
"scripts/*" = ["E402", "C901"]
"backend/app/api/*" = ["B008"]
# __init__.py 的 __all__ 导出会触发未使用告警
"backend/app/**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
combine-as-imports = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
    var
  | data/demo
  | frontend/node_modules
  | frontend/dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "tests"]
skip_glob = ["var/*", "data/demo/*", "frontend/*"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = ["var/", "data/demo/", "frontend/"]
# 说明：项目为渐进式类型标注，核心模块（retrieval / rag / ingest）均有完整注解，
# 这里只做基础检查，不作为 CI 阻塞项。
